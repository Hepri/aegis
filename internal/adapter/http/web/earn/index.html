<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis — Задачки</title>
  <link rel="stylesheet" href="/earn/earn.css">
</head>
<body>
  <main class="earn">
    <header>
      <h1>Задачки</h1>
      <p id="clientName" class="muted"></p>
      <button type="button" id="exitBtn" class="exitBtn">Выйти</button>
    </header>

    <section id="clientPick" class="card" hidden>
      <h2>Выбери компьютер</h2>
      <p class="muted small">Отладка из локальной сети — тот же экран, что у ребёнка</p>
      <div id="clientButtons" class="btnRow"></div>
    </section>

    <section id="userPick" class="card" hidden>
      <h2>Кто ты?</h2>
      <div id="userButtons" class="btnRow"></div>
    </section>

    <section id="mainPanel" class="card" hidden>
      <div class="balanceRow">
        <span>Баланс</span>
        <strong id="balance">0</strong>
        <span>мин</span>
      </div>

      <div id="taskBox">
        <p id="emptyTasks" class="muted" hidden>Пока нет задачек</p>
        <div id="taskContent" hidden>
          <p id="taskPrompt" class="prompt"></p>
          <p class="reward muted">Награда: <span id="taskReward">0</span> мин · ошибок: <span id="wrongCount">0</span>/<span id="wrongMax">3</span></p>
          <form id="answerForm">
            <div id="choiceButtons" class="choiceRow" hidden></div>
            <input id="answerInput" type="text" inputmode="numeric" autocomplete="off" placeholder="Ответ">
            <button type="submit" id="answerBtn">Ответить</button>
          </form>
          <div id="lockBanner" class="lockBanner" hidden>
            <span id="lockHint">Подожди</span>
            <strong id="lockSeconds">15</strong>
            <span>с</span>
          </div>
          <p id="answerFeedback" class="feedback" hidden></p>
        </div>
      </div>

      <div class="redeem">
        <h2>Купить время</h2>
        <div id="redeemButtons" class="btnRow"></div>
        <p id="redeemMsg" class="feedback" hidden></p>
      </div>

      <button type="button" id="exitBtnBottom" class="exitBtn exitBtnBottom">Выйти из Задачек</button>
    </section>
  </main>

  <script src="/earn/earn.js"></script>
</body>
</html>
